<!DOCTYPE html>
<html lang="de">
<head>
<style id="critical-css">
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:hidden;scroll-behavior:smooth}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  #page-loader{position:fixed;inset:0;z-index:99999;background:#0B1D3A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s ease,visibility .45s ease}
  #page-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .loader-logo{display:flex;align-items:center;gap:12px}
  .loader-logo-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#D4A843,#b5882a);display:flex;align-items:center;justify-content:center;font-size:24px}
  .loader-logo-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;font-weight:700;color:#fff}
  .loader-logo-text span{display:block;font-size:.65rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;color:rgba(255,255,255,.45);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .loader-spinner-wrap{position:relative;width:56px;height:56px}
  .loader-spinner{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:#D4A843;border-right-color:rgba(212,168,67,.4);animation:spin .9s cubic-bezier(.45,.05,.55,.95) infinite}
  .loader-spinner-inner{position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(255,255,255,.04);border-bottom-color:rgba(212,168,67,.6);animation:spin 1.4s cubic-bezier(.45,.05,.55,.95) infinite reverse}
  .loader-progress-bar{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
  .loader-progress-fill{height:100%;background:linear-gradient(90deg,#D4A843,#e8c96a,#D4A843);background-size:200% 100%;border-radius:99px;animation:prog 1.2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes prog{0%{background-position:200% 0;width:20%}50%{background-position:0% 0;width:80%}100%{background-position:-200% 0;width:100%}}
  .site-header{position:fixed;top:0;left:0;right:0;z-index:1000;height:72px;display:flex;align-items:center}
</style>

  <style>
    .error-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-2xl) var(--spacing-lg);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .error-page::after {
      content: '';
      position: absolute;
      bottom: -150px; right: -150px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 60%);
      border-radius: 50%;
      pointer-events: none;
    }
    .error-content { position: relative; z-index: 1; max-width: 600px; width: 100%; }
    .error-number {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--color-secondary-dark), var(--color-secondary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0;
      animation: float 4s ease-in-out infinite;
    }
    .error-links {
      display: flex;
      gap: var(--spacing-md);
      justify-content: center;
      flex-wrap: wrap;
      margin-top: var(--spacing-2xl);
    }

    @media (max-width: 768px) {
      .error-page  { padding: var(--spacing-2xl) var(--spacing-lg); }
      .error-content { padding: 0 var(--spacing-sm); }
      .error-number { font-size: clamp(5rem, 22vw, 9rem); }
    }

    @media (max-width: 480px) {
      .error-page  { padding: var(--spacing-xl) var(--spacing-md); }
      .error-links { flex-direction: column; align-items: center; }
      .error-links .btn { width: 100%; max-width: 280px; }
    }

    @media (max-width: 375px) {
      .error-number { font-size: 5rem; }
    }
  </style>

</head>
<body>
<script>
(function(){
  // Retour navigateur (bfcache) : enlève tout masquage résiduel instantanément
  window.addEventListener('pageshow', function(e){
    if(e.persisted){
      document.body.style.visibility = '';
      document.body.style.opacity = '';
      document.body.classList.remove('css-loading');
      var l = document.getElementById('page-loader');
      if(l){ l.style.opacity='0'; l.style.visibility='hidden'; if(l.parentNode) l.parentNode.removeChild(l); }
    }
  });
})();
</script>
<div class="error-page error-page-bg">
  <div class="error-content">

      <img src="assets/img/logo.svg" alt="KreditProfi Deutschland" class="logo-img" width="200" height="40">
    </a>
    <div class="error-number">404</div>
    <h1 style="color:white;font-size:clamp(1.5rem,4vw,2.2rem);margin-bottom:var(--spacing-lg);">
      Seite nicht gefunden
    </h1>
    <p style="color:rgba(255,255,255,0.65);font-size:var(--font-size-lg);margin-bottom:var(--spacing-xl);max-width:460px;margin-left:auto;margin-right:auto;">
      Die gesuchte Seite existiert nicht oder wurde verschoben. Aber keine Sorge — wir helfen Ihnen weiter.
    </p>
    <div class="error-links">
      <a href="index.html"      class="btn btn-white btn-lg">🏠 Zur Startseite</a>
      <a href="simulation.html" class="btn btn-outline-white">🧮 Kreditrechner</a>
      <a href="kontakt.html"    class="btn btn-outline-white">✉️ Kontakt</a>
    </div>
    <p style="color:rgba(255,255,255,0.35);font-size:var(--font-size-xs);margin-top:var(--spacing-3xl);">
      Fehlercode: 404 &nbsp;|&nbsp; KreditProfi Deutschland &nbsp;|&nbsp;
      <a href="index.html" style="color:rgba(255,255,255,0.4);">kreditprofi.de</a>
    </p>
  </div>
</div>
<script src="assets/js/loader.js"></script>
<script src="assets/js/cookie-consent.js"></script>
<script src="assets/js/config.js"></script>
</body>
</html>

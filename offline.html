<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — KreditProfi Deutschland</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: linear-gradient(135deg, #0B1D3A 0%, #1A4FA8 50%, #0B1D3A 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem; color: white;
    }
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px; padding: 3rem 2.5rem;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; display: block; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 1rem; }
    p  { color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 2rem; }
    .btn {
      display: inline-block; padding: 14px 32px;
      background: linear-gradient(135deg, #C9A84C, #D4A843);
      color: #0B1D3A; font-weight: 800; font-size: 1rem;
      border-radius: 12px; text-decoration: none; border: none; cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,168,67,0.4); }
    .info { font-size: 0.85rem; color: rgba(255,255,255,0.45); margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>Keine Internetverbindung</h1>
    <p>
      Sie sind momentan offline. Bitte überprüfen Sie Ihre Internetverbindung
      und versuchen Sie es erneut.
    </p>
    <button class="btn" onclick="window.location.reload()">🔄 Erneut versuchen</button>
    <p class="info">
      Einige Seiten von KreditProfi Deutschland sind auch offline verfügbar,
      falls Sie sie bereits besucht haben.
    </p>
  </div>
  <script>
    // Auto-retry wenn die Verbindung wiederhergestellt wird
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
